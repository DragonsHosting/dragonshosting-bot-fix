# ===========================================================================
# TICKET SYSTEM CONFIGURATION
# ===========================================================================
# MULTI-GUILD SUPPORT: Arrays like CategoryID: ["id1", "id2"] allow the bot
# to work in multiple guilds. Add ONE channel/category ID per guild.
# The bot automatically finds and uses the one that exists in the current guild.
# ===========================================================================

# ===========================================================================
# GENERAL TICKET SETTINGS
# ===========================================================================
TicketSettings:
  Enabled: false
  LogsChannelID: ["CHANNEL_ID"] # One channel per guild - bot finds the one in the current guild
  MaxTickets: 1
  DeletionTime: "3s"
  useSelectMenu: true
  overFlow: ["CATEGORY_ID", "CATEGORY_ID"]

  DelayedResponse:
    Enabled: false
    TicketThreshold: 25 # Send warning when there are this many open tickets
    Components:
      - Type: container
        AccentColor: "#FFA500"
        Components:
          - Type: section
            Text:
              Content:
                - "# 🎫 High Support Volume Notice"
                - ""
                - ⚠️ We are currently experiencing higher than usual ticket volume.
                - ""
                - "## Current Status"
                - "> 📊 **Active Tickets:** {openTickets}"
                - "> ⏱️ **Est. Response Time:** 24-48 hours"
                - "> 🔄 **Status:** Processing tickets in order received"
                - ""
                - "## Need Immediate Help?"
                - "• Review our [Documentation](https://docs.dragonshosting.nl)"
                - "• Join our [Community](https://discord.gg/DragonsHosting)"
            Accessory:
              Type: thumbnail
              Media:
                URL: "https://i.imgur.com/1FGL7XO.png"
          - Type: separator
          - Type: media_gallery
            Items:
              - Media:
                  URL: "https://i.imgur.com/LbjDuZ8.png"
          - Type: separator
          - Type: text_display
            Content: "-# Your ticket will still be created • Thank you for your patience"
  CloseReasons:
    Enabled: true
    DefaultReason: "No reason provided"
    Reasons:
      - name: "Issue Resolved"
        emoji: "✅"
        value: "resolved"
      - name: "User Request"
        emoji: "👋"
        value: "user_request"
      - name: "Inactive"
        emoji: "⏰"
        value: "inactive"
      - name: "Invalid"
        emoji: "❌"
        value: "invalid"
    AllowCustomReason: true

# ===========================================================================
# CLOSE REQUEST SYSTEM
# ===========================================================================
# Allows staff to request the ticket creator to close the ticket
# The user can accept or decline the request
CloseRequest:
  Enabled: true
  DefaultReason: "Issue has been resolved"
  AutoCloseOnAccept: true
  
  Components:
    - Type: container
      AccentColor: "#FFA500"
      Components:
        - Type: text_display
          Content:
            - "# 📩 Close Request"
            - ""
            - "Hey {user}!"
            - ""
            - "**{staff}** has requested to close this ticket."
            - ""
            - "**Reason:** {reason}"
            - ""
            - "If your issue has been resolved, please click **Accept** to close the ticket."
            - "If you still need help, click **Decline** and let us know."
        - Type: separator
        - Type: text_display
          Content: "-# Ticket System"
  Buttons:
    Accept:
      Label: "Accept & Close"
      Emoji: "✅"
      Style: "Success"
    Decline:
      Label: "Decline"
      Emoji: "❌"
      Style: "Secondary"

  Messages:
    Accepted: "Close request accepted by {user}. Closing ticket..."
    Declined: "Close request declined by {user}. Staff will continue to assist."
    DeclinedStaff: "{user} has declined the close request. Please continue assisting them."

# ===========================================================================
# STAFF MENTION ALERT
# ===========================================================================
# Alerts users when they mention a staff member who is offline/away
  StaffMentionAlert:
    Enabled: false
    AlertStatuses: ["offline", "idle", "dnd"]
    EmbedColor: "#FFA500"
    ShowAlternatives: true
    AlternativesTitle: "🟢 Available Staff"
    Messages:
      Offline: "⚠️ {staff} is currently **offline** and may not see your message right away."
      Idle: "⚠️ {staff} is currently **away** and may take longer to respond."
      DND: "⚠️ {staff} has **Do Not Disturb** enabled and may not respond immediately."

# ===========================================================================
# PRIORITY SYSTEM
# ===========================================================================
Priority:
  Enabled: false
  DefaultPriority: "Low"

  Levels:
    Low:
      Roles: ["ROLE_ID", "ROLE_ID"] # Roles assigned this priority
      Tag: ["ROLE_ID", "ROLE_ID"] # Roles to tag when a ticket is opened by this priority
      MoveTop: false # Should their ticket be moved to the top of the category?

    Medium:
      Roles: ["ROLE_ID", "ROLE_ID"] # Roles assigned this priority
      Tag: ["ROLE_ID", "ROLE_ID"] # Roles to tag when a ticket is opened by this priority
      MoveTop: true # Should their ticket be moved to the top of the category?

    High:
      Roles: ["ROLE_ID", "ROLE_ID"] # Roles assigned this priority
      Tag: ["ROLE_ID", "ROLE_ID"] # Roles to tag when a ticket is opened by this priority
      MoveTop: true # Should their ticket be moved to the top of the category?

# ===========================================================================
# WORKING HOURS
# ===========================================================================
WorkingHours:
  Enabled: false
  Timezone: Europe/London # https://gist.github.com/diogocapela/12c6617fc87607d11fd62d2a4f42b02a
  NonWorkingDays: ["Saturday", "Sunday"] # Days that are completely off - no working hours
  Schedule: 
    Monday: "16:00-22:00"
    Tuesday: "16:00-22:00"
    Wednesday: "16:00-22:00"
    Thursday: "16:00-22:00"
    Friday: "16:00-22:00"
    Saturday: "16:00-22:00"
    Sunday: "16:00-22:00"
  allowOpenTickets: true # Should people be able to open tickets during the off hours? 

WorkingEmbed: # This will be posted in the ticket if it's raised out of hours
  Components:
    - Type: container
      AccentColor: "#1769FF"
      Components:
        - Type: text_display
          Content:
            - "# Support Ticket Notice"
            - ""
            - Please note that this ticket has been raised outside of working hours.
            - Our response may be delayed.
            - " "
            - "Our working hours are between {workinghours_start} and {workinghours_end}."
        - Type: separator
        - Type: media_gallery
          Items:
            - Media:
                URL: "https://images-ext-1.discordapp.net/external/OllWGq5ta58LX6KoA8yEVTMrI9L4BJ0iE_T0pE4TZvw/https/i.imgur.com/LbjDuZ8.png?format=webp&quality=lossless&width=1618&height=403"
        - Type: separator
        - Type: text_display
          Content: "-# DragonsHosting Development | Ticket System"
TicketPanelSettings:
  Panel1:
    Components:
      - Type: container
        AccentColor: "#1769FF"
        Components:
          - Type: text_display
            Content:
              - "# 📩 Support Tickets"
              - ""
              - Please select a category below for assistance.
              - " "
              - "🕒 **Standard Working Hours**: {workinghours_start_monday} - {workinghours_end_monday}"
              - "_Note: We strive to be available outside these hours, but response times may be delayed._"
          - Type: separator
          - Type: media_gallery
            Items:
              - Media:
                  URL: "https://i.imgur.com/1FGL7XO.png"
          - Type: separator
          - Type: text_display
            Content: "-# DragonsHosting Development | Ticket System"
TicketTranscript:
  Type: WEB # TXT, WEB
  Save: true
  MinMessages: "1"
  SavePath: ./transcripts/  # This will save in a transcripts folder in your bot's root directory

# ===========================================================================
# TICKET CREATION TEMPLATES
# ===========================================================================
# {ticketType} displays the ticket type
# {user} is @John James
# {guild} displays the guild 
# {question} question array
# {answer} answer array
# {userIcon} displays the user's icon
TicketCreation:
  Default:
    Followup:
      Message: "Thank you {user} for reaching out! Please describe your issue in detail."
    Components:
      - Type: container
        AccentColor: "#1769FF"
        Components:
          - Type: section
            Text:
              Content:
                - "# 🎫 New Support Ticket"
                - ""
                - "Welcome to our Support System, {user}!"
                - ""
                - "**Ticket Type:** {ticketType}"
                - "**Expected Response Time:** Within 24 hours"
                - "**Claimed By:** {claimer}"
                - ""
                - "{questions}"
                - Our support team will assist you shortly.
            Accessory:
              Type: thumbnail
              Media:
                URL: "{userIcon}"
          - Type: separator
          - Type: text_display
            Content: "-# DragonsHosting Development | Ticket System"
    QuestionFormat:
      - "**{question}**"
      - "```{answer}```"

  TicketType1:
    Followup:
      Message: "Thank you {user} for your purchase inquiry! Our sales team will assist you shortly."
    Components:
      - Type: container
        AccentColor: "#00FF00"
        Components:
          - Type: section
            Text:
              Content:
                - "# ️ New Purchase Support Ticket"
                - ""
                - "Welcome to our Sales Support, {user}!"
                - ""
                - "**Ticket Type:** {ticketType}"
                - "**Expected Response Time:** Within 12 hours"
                - "**Claimed By:** {claimer}"
                - ""
                - "{questions}"
                - Our sales team will assist you shortly.
            Accessory:
              Type: thumbnail
              Media:
                URL: "{userIcon}"
          - Type: separator
          - Type: text_display
            Content: "-# DragonsHosting Development | Sales Support"
    QuestionFormat:
      - "**{question}**"
      - "```{answer}```"

# ===========================================================================
# ARCHIVE DESIGN
# ===========================================================================
ArchiveDesign:
  Components:
    - Type: container
      AccentColor: "#2B2D31"
      Components:
        - Type: section
          Text:
            Content:
              - "# Ticket Archived"
              - ""
              - "### 🎫 Ticket Status"
              - This ticket has been closed and archived.
              - ""
              - "### 👤 Details"
              - "> **Creator:** {userTag}"
              - "> **Reason:** {reason}"
              - ""
              - "### ⚡ Quick Actions"
              - • Use the buttons below to manage this ticket
              - "• Need help? Create a new ticket"
          Accessory:
            Type: thumbnail
            Media:
              URL: "https://i.imgur.com/1SbfB8i.png"
        - Type: separator
        - Type: media_gallery
          Items:
            - Media:
                URL: "https://i.imgur.com/LbjDuZ8.png"
        - Type: separator
        - Type: text_display
          Content: "-# DragonsHosting Development • Ticket System"
UserLeftDesign:
  Components:
    - Type: container
      AccentColor: "#1769FF"
      Components:
        - Type: section
          Text:
            Content:
              - "# User Alert"
              - ""
              - "The creator of this ticket, **{user}** has left the server."
          Accessory:
            Type: thumbnail
            Media:
              URL: "{userIcon}"
        - Type: separator
        - Type: text_display
