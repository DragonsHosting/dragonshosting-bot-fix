# ===========================================================================
# DARK JOKE COMMAND MESSAGES
# ===========================================================================
darkjokes:
  messages:
    - Geef een man een lucifer en hij heeft het een paar uur warm. Steek een man
      in brand en hij heeft het de rest van zijn leven warm.
    - Mijn vrouw en ik hebben de moeilijke beslissing genomen dat we geen
      kinderen willen. Als iemand ze wel wil, stuur me dan je contactgegevens en
      we brengen ze morgen langs.
    - |-
      Wat geef je een kind zonder armen voor kerst?
      Niets, hij kan het toch niet uitpakken.
    - |-
      Ik heb de rolstoel van mijn ex-vriendin afgepakt.
      Raad eens wie er weer naar me terug kwam kruipen?
    - |-
      Wanneer wordt een grap een vadergrap?
      Als hij weggaat en nooit meer terugkomt.
    - Kunnen wezen eten in een familierestaurant?
    - "Een man ging een bibliotheek binnen en vroeg om een boek over hoe je
      zelfmoord pleegt. De bibliothecaris zei: ‘Rot op, je brengt het toch niet
      terug."
    - |-
      Mijn oma met Alzheimer vertelde vroeger een grap.
      Ze zei: ‘Klop klop’, wij zeiden: ‘Wie is daar?’
      Dan zei ze: ‘Dat weet ik niet meer’… en begon te huilen.
    - |-
      Waarom kunnen wezen geen honkbal spelen?
      Ze weten niet waar ‘home’ is.
    - |-
      Waar ging Suzy heen nadat ze verdwaalde op een mijnenveld?
      OVERAL!
    - Ik ben al twee jaar op zoek naar de moordenaar van mijn ex-vriendin. Maar
      niemand wilde het doen.
    - |-
      Wat waren de laatste woorden van Stephen Hawking?
      Het Windows XP uitloggeluid.
    - Als je over een verkeersdrempel rijdt in een schoolzone en je je herinnert
      dat daar helemaal geen verkeersdrempels zijn.
    - Twee kinderen waren een jongen in een steegje in elkaar aan het slaan, dus
      ik sprong erbij om te helpen. Hij maakte geen schijn van kans tegen ons
      drieën.
    - Mijn ex had laatst een zwaar ongeluk. Ik gaf de dokter het verkeerde
      bloedtype. Nu weet ze echt hoe afwijzing voelt.
    - "Toen Jim op zijn telefoon zat, zei mijn opa: ‘Je gebruikt veel te veel
      technologie!’ Jim zei: ‘Nee, JIJ gebruikt te veel technologie!’ en trok
      toen de stekker van opa’s levensondersteuning eruit."
    - "Ik zal de laatste woorden van mijn opa altijd herinneren: Stop met de
      ladder te schudden, klootzak!"
    - |-
      Wil je Afrikaans eten proberen?
      Zij ook.
    - Kinderen op de achterbank veroorzaken ongelukken en ongelukken op de
      achterbank veroorzaken kinderen.
    - Wat doe je als je een tijdschrift uit hebt in het ziekenhuis? Herladen en
      verder schieten.
    - |-
      Hoe geef je een verrassingsfeest in een ziekenhuis?
      Neem een stroboscoop mee naar de epilepsie-afdeling.
    - Ik heb een vis die kan breakdancen! Maar alleen 20 seconden… en maar één
      keer.
    - >-
      Wat is het laatste dat door het hoofd van een vlieg gaat wanneer hij tegen
      de voorruit van een auto botst die 110 km/u rijdt?

      Zijn achterwerk.
    - Mijn vader stierf toen we zijn bloedgroep niet meer wisten. Terwijl hij
      stierf bleef hij zeggen dat we ‘positief moesten blijven’, maar dat is
      moeilijk zonder hem.
    - |-
      Je hebt geen parachute nodig om te skydiven.
      Je hebt een parachute nodig om twee keer te skydiven.
    - Mijn vriendin, die van sterrenkunde houdt, vroeg me hoe sterren sterven.
      ‘Meestal een overdosis’, zei ik.
    - "Mijn oudere familieleden plaagden me op bruiloften altijd met: ‘Jij bent
      de volgende!’ Dat stopte snel toen ik hetzelfde begon te zeggen op
      begrafenissen."
    - Mijn vrouw en ik hebben een moeilijke keuze gemaakt en besloten dat we
      geen kinderen willen. Als iemand ze wel wil, stuur je contactgegevens en
      we brengen ze morgen langs.
    - |-
      Ik wil vredig in mijn slaap sterven, net als mijn opa.
      Niet schreeuwend zoals de passagiers in zijn auto.
    - Ik begon te huilen toen mijn vader uien aan het snijden was. Uien was zo’n
      goede hond.
    - Als het de eerste keer niet lukt… dan is skydiven waarschijnlijk niets
      voor jou.
    - >-
      Ze zeggen dat er in elke vriendengroep iemand zit die tot moord in staat
      is.

      Ik dacht dat het Dave was, dus ik heb hem maar eerst vermoord.
    - "Ik zal nooit de laatste woorden van mijn opa vergeten: ‘Hou je de ladder
      nog vast?’"
    - Wat is geel en kan niet zwemmen? Een bus vol kinderen.
    - De dokter gaf me nog één jaar te leven, dus ik schoot hem neer. De rechter
      gaf me 15 jaar. Probleem opgelost.
    - |-
      Toen we kinderen waren, waren we bang voor het donker.
      Toen we ouder werden, werden we bang voor de elektriciteitsrekening!
    - |-
      Patiënt: Oh dokter, ik ben zo zenuwachtig. Dit is mijn eerste operatie.
      Dokter: Geen zorgen. De mijne ook.
    - Ik haat het dat begrafenissen altijd om 9 uur ’s ochtends zijn. Ik ben
      niet echt een ‘rouw’-persoon.
    - Waarom lijken vrienden op sneeuw? Als je erop plast, verdwijnen ze.
    - Mijn therapeut zegt dat ik een obsessie met wraak heb. Dat zullen we nog
      wel zien.
    - Het is belangrijk om een goede woordenschat te hebben. Als ik het verschil
      tussen ‘antidotum’ en ‘anekdote’ had geweten, zou een goede vriend van mij
      nog leven.
    - "Ze zeggen: je bent wat je eet. Ik kan me niet herinneren dat ik een
      enorme teleurstelling heb gegeten."
    - Waarom hoor je een psychiater nooit op de wc? Omdat de ‘P’ stil is.
    - Ik heb een grap over trickle‑down economie. Maar 99% van jullie zal hem
      nooit begrijpen.
    - Een nieuw onderzoek zegt dat mensen meer bananen eten dan apen. Ik kan me
      niet herinneren wanneer ik voor het laatst een aap heb gegeten.
    - Ik zei tegen mijn vrouw dat ze haar fouten moest omarmen. Toen gaf ze me
      een knuffel.
    - "Mijn vrouw liet een briefje op de koelkast achter: ‘Dit werkt niet meer,
      tot ziens.’ Ik deed hem open en hij werkt nog prima."
    - Je weet dat mensen je niet mogen als jij altijd de camera krijgt wanneer
      er een groepsfoto wordt gemaakt.
    - Waarom raken begraafplaatsen nooit overvol? Omdat mensen staan te popelen
      om erin te gaan.
    - Ik heb een EpiPen. Mijn vriend gaf hem aan mij toen hij stervende was. Het
      leek erg belangrijk voor hem dat ik hem kreeg.
    - Vandaag was een verschrikkelijke dag. Mijn ex werd aangereden door een
      bus, en ik verloor mijn baan als buschauffeur.
    - Ik was niet van plan om vandaag te gaan hardlopen, maar die politieagenten
      kwamen ineens opdagen.
    - Ik gaf de ambulancebroeders het verkeerde bloedtype van mijn ex, zodat hij
      weet hoe afwijzing voelt.
    - Mijn rouwtherapeut stierf laatst. Hij was zo goed in zijn werk dat het me
      eigenlijk niets doet.
    - De uitvinder van autocorrect is overleden. Zijn funeraal zal worden
      gehouden op Sundial.
    - Ik wilde niet geloven dat mijn vader van zijn werk als verkeersagent stal,
      maar toen ik thuiskwam waren alle tekenen er.
    - Geef een man een lucifer en hij heeft het een paar uur warm. Steek hem in
      brand en hij heeft het de rest van zijn leven warm.

