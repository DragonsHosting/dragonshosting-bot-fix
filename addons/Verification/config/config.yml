# ===========================================================================
# VERIFICATION & JOIN ROLES CONFIGURATION
# ===========================================================================
JoinRoleSettings:
  Enabled: true
  JoinRoles: ["0"] # Roles users get immediately when they join your server
  RestoreRoles: # Should the user get back their original roles before leaving the server?
    Enabled: false # Leave below blank to give all roles
    Blacklist: ["ROLE_ID", "ROLE_ID"] # If used, any roles not in the whitelist won't be given
    Whitelist: ["ROLE_ID", "ROLE_ID"] # If used, all roles will be given apart from the ones defined

# Verification Types:
# BUTTON - When a user clicks the button, they get the specified role
# CALCULATOR - Solve a math question to get a specified role
VerificationSettings:
  Enabled: false # Enable users to verify when they join your discord server?
  DeleteAllMessages: false # Delete all user messages in the verification channel?
  ChannelID: ["CHANNEL_ID"] # Supports multiple channel IDs for different guilds
  VerificationType: BUTTON # Options: BUTTON, CALCULATOR, CAPTCHA
  VerifiedRoleID: ["ROLE_ID"] # Roles users get when they successfully verify
  RoleToRemove: [""] # Supports multiple role IDs for different guilds
  EnableUnverifiedRole: false # Enable the Unverified role? (Automatically created and denied access to all channels other than verify channel)

VerificationButton:
  Name: "Verify"
  Emoji: "✅"
  Color: Secondary # Primary, Secondary, Success, Danger
  Text: "Click the button to verify!"

# ===========================================================================
# VERIFICATION MESSAGE DESIGN
# ===========================================================================
# Placeholders available:
# {guildName} - Server name
# {guildIcon} - Server icon URL
# {memberCount} - Current member count
VerificationEmbed:
  Components:
    - Type: container
      AccentColor: "#5865F2"
      Spoiler: false
      Components:
        - Type: section
          Text:
            Content: |-
              **Verify**\n\nPlease verify to get full access to the server.
              Click the **button** below to get verified!
          Accessory:
            Type: thumbnail
            Media:
              Url: "{guildIcon}"
        - Type: separator
          Divider: true
          Spacing: small
        - Type: media_gallery
          Items:
            - Media:
                Url: https://i.imgur.com/R4qVpUy.png