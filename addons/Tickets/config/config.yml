Alert:
  Enabled: true
  Time: "12h"
  DM:
    Enabled: true
    LogFailures: false # Whether to log DM failures in the ticket channel
    Components:
      - Type: container
        AccentColor: "#FF0000"
        Components:
          - Type: text_display
            Content:
              - "# ⚠️ Ticket Alert"
              - ""
              - "Hello {user}"
              - " "
              - "**Ticket Information**"
              - "> **Server:** {guild}"
              - "> **Time Until Close:** {time}"
              - "> **Reason:** {reason}"
              - " "
              - "**⚠️ Action Required**"
              - Your ticket requires attention and will be automatically closed if no response is received.
              - Click the button below to go to your ticket.
          - Type: separator
          - Type: text_display
            Content: "-# Dragonshosting | Ticket System"
    Button:
      Label: "Go to Ticket"
      Emoji: "🎫"

  Embed:
    Title: "Support Ticket Notice"
    Description:
      - "**Ticket Information**"
      - "> **User:** {user}"
      - "> **Time Until Close:** {time}"
      - "> **Reason:** {reason}"
      - " "
      - "**⚠️ Action Required**"
      - "This ticket requires attention and will be automatically closed if no response is received."
    Footer:
      Text: "Dragonshosting | Ticket System"
      Icon: "https://i.imgur.com/w5XxKpc.png"
    Author:
      Text: "Dragonshosting Support"
      Icon: "https://i.imgur.com/w5XxKpc.png"
    Color: "#FF0000"
    Image: "https://images-ext-1.discordapp.net/external/OllWGq5ta58LX6KoA8yEVTMrI9L4BJ0iE_T0pE4TZvw/https/i.imgur.com/LbjDuZ8.png?format=webp&quality=lossless&width=1618&height=403"
    Thumbnail: ""
    Button:
      Label: "Close Ticket"
      Emoji: "🔒"
      Style: "Danger" # Primary, Secondary, Success, Danger

# ===========================================================================
# TICKET CLOSURE DM
# ===========================================================================
TicketClosureDM:
  Enabled: true
  Transcript: true
  Components:
    - Type: container
      AccentColor: "#1769FF"
      Components:
        - Type: section
          Text:
            Content:
              - "# Ticket Closure Notification"
              - ""
              - "{userTag}, your ticket in {guild} has been closed."
              - " "
              - "**Ticket Summary**"
              - "> **Messages:** {messageCount}"
              - "> **Priority:** {priority}"
              - "> **Handled By:** {claimer}"
              - "> **Close Reason:** {reason}"
              - " "
              - "We value your feedback! Please leave us a review below."
          Accessory:
            Type: thumbnail
            Media:
              URL: "https://i.imgur.com/w5XxKpc.png"
        - Type: separator
        - Type: media_gallery
          Items:
            - Media:
                URL: "https://images-ext-1.discordapp.net/external/OllWGq5ta58LX6KoA8yEVTMrI9L4BJ0iE_T0pE4TZvw/https/i.imgur.com/LbjDuZ8.png?format=webp&quality=lossless&width=1618&height=403"
        - Type: separator
        - Type: text_display
          Content: "-# Dragonshosting | Ticket System"
Reviews:
  Enabled: false
  Placeholder: "Rate us!"
  ButtonEmoji: "⭐"
  ChannelID: ["CHANNEL", ""]
  ButtonStyle: "Secondary" # Primary, Secondary, Success, Danger
  
  # Multiple rating questions that will appear as select dropdowns in the modal
  Questions:
    1:
      ID: "support_quality"
      Label: "Support Quality (1-5)"
      Description: "Rate the quality of support you received"
      Required: true
      Options:
        - Label: "Very Poor"
          Value: "1"
          Emoji: "😞"
        - Label: "Poor"
          Value: "2"
          Emoji: "😐"
        - Label: "Average"
          Value: "3"
          Emoji: "🙂"
        - Label: "Good"
          Value: "4"
          Emoji: "😊"
        - Label: "Excellent"
          Value: "5"
          Emoji: "😍"
  
  # Optional feedback text input
  FeedbackInput:
    Enabled: false # Should the bot ask the user why for the review they gave?
    Label: "Additional Feedback"
    Placeholder: "Please share any additional thoughts or suggestions..."
    Style: "Paragraph" # Short, Paragraph
    Required: false
    MaxLength: 1000


































































































































































  Components:
